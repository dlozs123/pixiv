<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片归档页</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>图片归档页</h1>
        </header>

        <div id="artistGrid" class="artist-grid">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <!-- 角色切换器 -->
    <div class="character-switcher" id="characterSwitcher" style="display: none;">
        <button class="switcher-btn" id="switcherBtn" title="切换角色">
            <img id="currentCharAvatar" src="" alt="" class="avatar-img">
            <span id="currentCharName" class="avatar-name"></span>
        </button>
        <div class="switcher-dropdown" id="switcherDropdown">
            <!-- 角色头像列表动态生成 -->
        </div>
    </div>

    <script src="home.js"></script>
</body>
</html>
